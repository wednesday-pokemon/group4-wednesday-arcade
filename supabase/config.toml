# Supabase CLI config (CLI 2.121) for "Escape from Raven Island: The Hyde's Regatta".
# Local:  npx supabase start   (requires Docker)   |   Hosted: npx supabase link / db push / functions deploy
# Hosted Auth settings are NOT pushed by `db push`; mirror the [auth] block in the Dashboard (docs/SUPABASE_SETUP.md).
project_id = "raven-regatta"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]   # schema `private` is intentionally NOT exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the hosted project's Postgres major version (Dashboard > Settings > Infrastructure). Needs >= 15.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by the operator only (supabase/scripts/provision-users.mjs). No public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Optional: pin browser origins (comma-separated). Unset or "*" = any origin (bearer auth, no cookies).
# [edge_runtime.secrets]
# ALLOWED_ORIGINS = "env(ALLOWED_ORIGINS)"

# Every function requires a valid user JWT at the gateway AND re-verifies it in code (getUser + app_users).
[functions.create-session]
enabled = true
verify_jwt = true

[functions.get-session]
enabled = true
verify_jwt = true

[functions.prepare-leg]
enabled = true
verify_jwt = true

[functions.resolve-leg]
enabled = true
verify_jwt = true

[functions.finish-session]
enabled = true
verify_jwt = true

[functions.admin-reset]
enabled = true
verify_jwt = true

# mystery-v3.1 "The Silent Evidence" (station accounts; same JWT + app_users checks)
[functions.mystery-create-session]
enabled = true
verify_jwt = true

[functions.mystery-get-session]
enabled = true
verify_jwt = true

[functions.mystery-select-duo]
enabled = true
verify_jwt = true

[functions.mystery-append-events]
enabled = true
verify_jwt = true

[functions.mystery-finalize]
enabled = true
verify_jwt = true

[analytics]
enabled = true
port = 54327
backend = "postgres"
